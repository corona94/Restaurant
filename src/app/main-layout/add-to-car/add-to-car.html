<div class="fixed bottom-4 right-3 z-50">

  <!-- Botón carrito -->
  <div
    (click)="toggleCart()"
    class="relative rounded-full p-4 border-2 border-[#89B0AE] bg-white shadow-lg cursor-pointer">

    <span
      class="absolute -top-2 -right-1 flex items-center justify-center
             w-8 h-8 bg-[#555B6E] text-white text-xl rounded-full">
      {{ totalItems }}
    </span>

    <ng-icon
      name="lucideShoppingCart"
      size="40"
      strokeWidth="3"
      color="#89B0AE">
    </ng-icon>

  </div>

  @if(showCart){

    <!-- Overlay -->
    <div
      class="fixed inset-0 bg-black/50 z-40"
      (click)="showCart = false">
    </div>

    <!-- Modal -->
    <aside
      class="fixed top-4 right-4 bottom-4 left-4
             bg-white rounded-xl shadow-2xl z-50 p-6">

      <!-- Header -->
      <div class="flex justify-between items-center border-b pb-4">

        <h2 class="text-2xl font-bold">
          Mi carrito
        </h2>

        <button
          (click)="showCart = false"
          class="text-3xl leading-none">
          ×
        </button>

      </div>

      <!-- Productos -->
      <div class="mt-4 overflow-y-auto h-[calc(100%-220px)]">

        <div
          *ngFor="let item of itemsInCart; let i = index"
          class="flex items-center p-3 rounded-xl shadow-md border mb-3 relative">

          <!-- Imagen -->
          <img
            [src]="item.image"
            [alt]="item.name"
            class="w-20 h-20 rounded-lg object-cover">

          <!-- Información -->
          <div class="ml-4 flex-1">

            <h3 class="font-semibold text-lg">
              {{ item.name }}
            </h3>

            <p class="text-gray-500">
              Cantidad: {{ item.quantity }}
            </p>

            <p class="font-medium">
              {{ item.price }}
            </p>

          </div>

          <!-- Eliminar -->
          <button
            (click)="removeItem(i)"
            class="flex items-center justify-center
                   w-8 h-8 rounded-full
                   border border-red-500
                   text-red-500
                   hover:bg-red-500 hover:text-white
                   transition">

            <ng-icon
              name="lucideMinus"
              size="18">
            </ng-icon>

          </button>

        </div>

      </div>

      <!-- Total -->
      <div class="border-t pt-4">

        <div class="flex justify-between text-xl font-bold">

          <span>Total</span>

          <span>${{ total.toFixed(2) }}</span>

        </div>

      </div>

      <!-- Botones -->
      <div class="absolute bottom-6 left-6 right-6 space-y-3">

        <button
  (click)="sendWhatsApp()"
  class="w-full bg-[#25D366] text-white py-3 rounded-lg font-semibold">
  Enviar por WhatsApp
</button>

        <button
          (click)="clearCart()"
          class="w-full border border-red-500 text-red-500 py-3 rounded-lg hover:bg-red-50">
          Vaciar carrito
        </button>

      </div>

    </aside>

  }

</div>
